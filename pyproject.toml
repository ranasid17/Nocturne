[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne-qusa"
version = "0.1.0"
description = "Local overnight-regime research and prediction application"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "flask>=2.3",
  "joblib",
  "numpy",
  "pandas",
  "pandas_market_calendars>=5.0,<5.2",
  "python-dotenv>=1.0",
  "pyyaml",
  "requests",
  "scikit-learn",
]

[project.optional-dependencies]
research = ["matplotlib"]
test = ["pytest", "pytest-cov"]

[project.scripts]
nocturne = "qusa.cli:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["qusa*", "web_app*"]

[tool.setuptools.package-data]
"qusa.utils" = ["defaults.yaml"]
web_app = ["templates/*.html", "static/css/*.css", "static/js/*.js", "static/icons/*.svg", "static/icons/LICENSE"]
